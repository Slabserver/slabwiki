{{/* Theme toggle chip: shows the theme it will switch TO.
     Persists in localStorage('slab-theme'); baseof's pre-paint script reads it. */}}
<button id="theme-toggle" type="button" aria-label="Toggle theme"
        class="mc-btn mc-btn-dark shrink-0 !text-pixel-label">
  <span id="theme-toggle-dark">{{ partial "mc-icon.html" "tinted-glass" }}</span>
  <span id="theme-toggle-light" class="hidden">{{ partial "mc-icon.html" "glowstone" }}</span>
  <span id="theme-toggle-label">Dark</span>
</button>
<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  var label = document.getElementById('theme-toggle-label');
  function current(){
    return document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function sync(){
    var light = current() === 'light';
    label.textContent = light ? 'Dark' : 'Light';
    document.getElementById('theme-toggle-dark').classList.toggle('hidden', !light);
    document.getElementById('theme-toggle-light').classList.toggle('hidden', light);
  }
  btn.addEventListener('click', function(){
    var next = current() === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('slab-theme', next);
    sync();
  });
  sync();
})();
</script>
